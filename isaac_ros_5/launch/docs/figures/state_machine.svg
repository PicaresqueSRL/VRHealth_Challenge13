<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="780" height="300" fill="#fff"/>
<g stroke="#333" stroke-width="1.2">
<rect x="20" y="110" width="140" height="56" rx="26" fill="#f1f1f1"/>
<rect x="240" y="110" width="140" height="56" rx="26" fill="#dbe9f7"/>
<rect x="470" y="110" width="140" height="56" rx="26" fill="#fde8d5"/>
<rect x="640" y="30" width="125" height="50" rx="24" fill="#e2f3e2"/>
<rect x="640" y="200" width="125" height="50" rx="24" fill="#f6d6d6"/>
<rect x="215" y="225" width="190" height="50" rx="24" fill="#f6d6d6"/>
</g>
<g text-anchor="middle">
<text x="90" y="134" font-weight="bold">WAIT_FIRST</text><text x="90" y="150" font-size="10">O_first = None</text>
<text x="310" y="134" font-weight="bold">READY</text><text x="310" y="150" font-size="10">pending = None</text>
<text x="540" y="134" font-weight="bold">PENDING</text><text x="540" y="150" font-size="10">attempt k in progress</text>
<text x="702" y="52" font-weight="bold">LOCALIZED</text><text x="702" y="67" font-size="10">loc_ns set</text>
<text x="702" y="222" font-weight="bold">EXHAUSTED</text><text x="702" y="237" font-size="10">attempts = --attempts</text>
<text x="310" y="247" font-weight="bold">STALLED</text><text x="310" y="262" font-size="10">no odometry ≥ stall-timeout</text>
</g>
<g stroke="#333" fill="none" marker-end="url(#a)">
<path d="M160,138 L238,138"/>
<path d="M380,128 L468,128"/>
<path d="M500,166 C470,210 380,200 345,168"/>
<path d="M610,122 L660,82"/>
<path d="M590,166 L650,205"/>
<path d="M90,166 C100,250 180,252 213,250" stroke-dasharray="4 3"/>
</g>
<g font-size="10">
<text x="165" y="128">first odometry</text><text x="165" y="158">O_first = O</text><text x="165" y="170">next = ts</text>
<text x="386" y="82">odometry with ts ≥ next</text><text x="386" y="95">and k &lt; --attempts:</text><text x="386" y="108" fill="#24538a">k += 1, call_async(prior_k)</text>
<text x="420" y="205">/rosout "Failed to localize" or</text><text x="420" y="218">"Cannot localize", k &lt; --attempts:</text><text x="420" y="231">next = call_ts + attempt_every</text>
<text x="520" y="70">/rosout</text><text x="520" y="83">"Successfully localized"</text>
<text x="615" y="185">failed, k = --attempts</text>
<text x="20" y="290" fill="#555">from any state (dashed): no odometry for --stall-timeout s of wall time → playback interrupted (stalled = True)</text>
</g>
<text x="20" y="22" fill="#555" font-size="10">Odometry messages are always appended to the trace in every state; the states only decide when a new attempt is made.</text>
<text x="20" y="36" fill="#555" font-size="10">LOCALIZED and EXHAUSTED keep listening until the end of the cut (t2) + --settle s.</text>
</svg>
