<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="800" height="300" fill="#fff"/>
<text x="10" y="18" font-weight="bold">Frames of the query bag around the localization (one tick = one tracked frame, ≈ 67 ms)</text>
<path d="M20,120 L785,120" stroke="#333" marker-end="url(#a)"/>
<g stroke="#333">
<line x1="40" y1="113" x2="40" y2="127"/><line x1="100" y1="113" x2="100" y2="127"/><line x1="160" y1="113" x2="160" y2="127"/>
<line x1="220" y1="113" x2="220" y2="127"/><line x1="280" y1="113" x2="280" y2="127"/><line x1="340" y1="113" x2="340" y2="127"/>
<line x1="420" y1="113" x2="420" y2="127"/><line x1="500" y1="113" x2="500" y2="127"/><line x1="560" y1="113" x2="560" y2="127"/>
<line x1="620" y1="113" x2="620" y2="127"/>
</g>
<g text-anchor="middle" font-size="10">
<text x="40" y="140">c − 2</text><text x="100" y="140">c − 1</text><text x="160" y="140" font-weight="bold">c</text>
<text x="220" y="140">c + 1</text><text x="280" y="140">c + 2</text><text x="340" y="140" font-weight="bold">L</text>
<text x="420" y="140">L + 1</text><text x="500" y="140" font-weight="bold">S</text><text x="560" y="140">S + 1</text>
<text x="160" y="153" fill="#24538a">call</text><text x="340" y="153" fill="#2b6b2f">localized</text><text x="340" y="165" fill="#2b6b2f">frame</text>
<text x="420" y="153" fill="#8a2b6b">transitional</text><text x="500" y="153" fill="#8a2b6b">settled</text>
<text x="710" y="140">… +1 s … +2 s … t2</text>
</g>
<path d="M370,60 L370,108" stroke="#2b6b2f" marker-end="url(#a)"/>
<text x="376" y="56" fill="#2b6b2f">"Successfully localized at {x,y,z}" received (recv time)</text>
<text x="376" y="70" fill="#2b6b2f" font-size="10">L = last odometry received before the log</text>
<rect x="30" y="80" width="325" height="22" fill="#e2f3e2" fill-opacity="0.6" stroke="#3f8f45" stroke-dasharray="3 2"/>
<text x="38" y="95" font-size="10">localizer metric: logged position vs reference, best frame</text>
<text x="20" y="190" font-weight="bold">map→odom published at each frame</text>
<g font-size="10">
<rect x="30" y="200" width="350" height="22" fill="#eee" stroke="#999"/><text x="205" y="215" text-anchor="middle">M0 (before: identity for a new session)</text>
<rect x="380" y="200" width="80" height="22" fill="#efd5ea" stroke="#8a2b6b"/><text x="420" y="215" text-anchor="middle">≠ M0, ≠ next</text>
<rect x="460" y="200" width="325" height="22" fill="#e2f3e2" stroke="#3f8f45"/><text x="622" y="215" text-anchor="middle">settled: ≠ M0 and = next frame (≤ 1 cm, ≤ 0.5°)</text>
</g>
<g font-size="10" fill="#333">
<text x="20" y="245">published pose at frame f = map→odom(f) · O(f), exact stamps from the recorded /tf (no interpolation)</text>
<text x="20" y="260">at S: loc_err_t_m / loc_err_r_deg, published_tp (≤ --thr-t and ≤ --thr-r); then pub_err at the first frames ≥ L + 1 s and L + 2 s</text>
<text x="20" y="275">from S to t2: one row per frame in post_localization.csv; post_rmse / max / final error in queries.csv</text>
<text x="20" y="290">loc_delay_s = L − first frame; tf_update_delay_s = S − L; log_frame_offset = L − best frame of the localizer metric</text>
</g>
</svg>
