<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="800" height="330" fill="#fff"/>
<text x="10" y="18" font-weight="bold">Setup (wall time, before the playback)</text>
<g font-size="10.5">
<rect x="10" y="28" width="150" height="34" rx="5" fill="#e2f3e2" stroke="#3f8f45"/><text x="85" y="42" text-anchor="middle">ros2 launch</text><text x="85" y="56" text-anchor="middle">visual_slam_node</text>
<rect x="170" y="28" width="150" height="34" rx="5" fill="#dbe9f7" stroke="#3d6fa3"/><text x="245" y="42" text-anchor="middle">wait_for_service</text><text x="245" y="56" text-anchor="middle">localize_in_map (≤ 60 s)</text>
<rect x="330" y="28" width="150" height="34" rx="5" fill="#dbe9f7" stroke="#3d6fa3"/><text x="405" y="42" text-anchor="middle">publish /tf_static</text><text x="405" y="56" text-anchor="middle">(latched, once)</text>
<rect x="490" y="28" width="150" height="34" rx="5" fill="#f1f1f1" stroke="#777"/><text x="565" y="42" text-anchor="middle">ros2 bag record</text><text x="565" y="56" text-anchor="middle">+ sleep 2 s</text>
<rect x="650" y="28" width="140" height="34" rx="5" fill="#fde8d5" stroke="#c9782f"/><text x="720" y="42" text-anchor="middle">ros2 bag play</text><text x="720" y="56" text-anchor="middle">from t1 − 0.1 s</text>
</g>
<text x="10" y="100" font-weight="bold">Playback (bag time, real-time rate) — typical values: median of the 192 queries</text>
<path d="M20,190 L780,190" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<g stroke="#333">
<line x1="40" y1="182" x2="40" y2="198"/><line x1="120" y1="182" x2="120" y2="198"/><line x1="200" y1="182" x2="200" y2="198"/>
<line x1="240" y1="182" x2="240" y2="198"/><line x1="340" y1="182" x2="340" y2="198"/>
<line x1="440" y1="182" x2="440" y2="198"/><line x1="640" y1="182" x2="640" y2="198"/><line x1="720" y1="182" x2="720" y2="198"/>
</g>
<g text-anchor="middle">
<text x="40" y="214">t1 − 0.1</text>
<text x="120" y="214" font-weight="bold">first frame</text><text x="120" y="226">(≈ t1)</text>
<text x="196" y="214" font-weight="bold">L</text><text x="196" y="226">+0.27 s</text>
<text x="244" y="214" font-weight="bold">S</text><text x="244" y="226">L+0.13 s</text>
<text x="340" y="214">L + 1 s</text><text x="440" y="214">L + 2 s</text>
<text x="640" y="214" font-weight="bold">t2 = t1 + duration</text>
<text x="720" y="226">+ settle 3 s</text>
</g>
<g font-size="10">
<path d="M120,175 L120,125" stroke="#24538a" marker-end="url(#a)"/><text x="125" y="122" fill="#24538a">attempt 1: localize_in_map(pose_hint = prior_1 = T_last), service answers at once ("started")</text>
<path d="M200,175 L200,145" stroke="#2b6b2f" marker-end="url(#a)"/><text x="205" y="142" fill="#2b6b2f">/rosout "Successfully localized at {x, y, z}" (≈ 180 ms after the call); L = last frame received before it</text>
<text x="205" y="154" fill="#2b6b2f">("Failed to localize ..." instead → new attempt at the first frame ≥ call + 0.25 s)</text>
<path d="M240,175 L240,165" stroke="#8a2b6b"/><text x="245" y="170" fill="#8a2b6b">S: first frame with the new, stable map→odom → published pose = map→odom · O</text>
</g>
<text x="735" y="182" fill="#333" text-anchor="end" font-size="10">bag time</text>
<rect x="120" y="262" width="80" height="14" fill="#fde8d5" stroke="#c9782f"/><text x="160" y="292" text-anchor="middle" font-size="10">loc_delay_s</text>
<rect x="200" y="262" width="40" height="14" fill="#efd5ea" stroke="#8a2b6b"/><text x="225" y="306" text-anchor="middle" font-size="10">tf_update_delay_s</text>
<rect x="240" y="262" width="400" height="14" fill="#e2f3e2" stroke="#3f8f45"/><text x="440" y="292" text-anchor="middle" font-size="10">post-localization errors (post_localization.csv, post_rmse / max / final)</text>
<text x="10" y="322" fill="#555" font-size="10">Then: processes stopped, query bag read back, metrics computed (evaluate_bag). Wall time per query ≈ 16.5 s (10 s cut + setup + settle + stop).</text>
</svg>
