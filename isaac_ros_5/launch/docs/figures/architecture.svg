<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<rect width="780" height="420" fill="#fff"/>
<rect x="250" y="10" width="280" height="150" rx="8" fill="#dbe9f7" stroke="#3d6fa3"/>
<text x="390" y="28" text-anchor="middle" font-weight="bold">localize_query.py (main process)</text>
<text x="390" y="44" text-anchor="middle" fill="#444">rclpy node QueryNode "localize_query_&lt;pid&gt;"</text>
<text x="262" y="66">subscribes: /visual_slam/tracking/odometry</text>
<text x="262" y="81">            /rosout (RELIABLE, VOLATILE, depth 200)</text>
<text x="262" y="96">            /tf, /tf_static (TransformListener)</text>
<text x="262" y="111">            /cam2/imu (only with --g-map)</text>
<text x="262" y="126">publishes:  /tf_static (TRANSIENT_LOCAL, once)</text>
<text x="262" y="141">client:     /visual_slam/localize_in_map</text>
<text x="262" y="154" fill="#666">spin_once every 10 ms while the bag plays</text>
<rect x="10" y="215" width="230" height="110" rx="8" fill="#fde8d5" stroke="#c9782f"/>
<text x="125" y="233" text-anchor="middle" font-weight="bold">ros2 bag play (subprocess)</text>
<text x="22" y="252">--start-offset t1 - 0.1</text>
<text x="22" y="267">--playback-duration duration + 0.1</text>
<text x="22" y="282">/cam2/infra{1,2}/image_rect_raw</text>
<text x="22" y="297">/cam2/infra{1,2}/camera_info</text>
<text x="22" y="312">/cam2/imu (real-time rate)</text>
<rect x="275" y="215" width="230" height="110" rx="8" fill="#e2f3e2" stroke="#3f8f45"/>
<text x="390" y="233" text-anchor="middle" font-weight="bold">ros2 launch (subprocess)</text>
<text x="390" y="250" text-anchor="middle">component_container_mt</text>
<text x="390" y="266" text-anchor="middle" font-weight="bold">visual_slam_node</text>
<text x="390" y="282" text-anchor="middle">isaac_ros_cuvslam 5.0, cuVSLAM 15</text>
<text x="390" y="298" text-anchor="middle">new session, no map loaded</text>
<text x="390" y="314" text-anchor="middle" fill="#555">..._localize.launch.py (--launch)</text>
<rect x="540" y="215" width="230" height="110" rx="8" fill="#f1f1f1" stroke="#777"/>
<text x="655" y="233" text-anchor="middle" font-weight="bold">ros2 bag record -s mcap</text>
<text x="552" y="252">/visual_slam/tracking/odometry</text>
<text x="552" y="267">/visual_slam/tracking/slam_path</text>
<text x="552" y="282">/visual_slam/status</text>
<text x="552" y="297">/tf  (map-&gt;odom, odom-&gt;cam2_link)</text>
<text x="552" y="312">/rosout  -&gt; qNNN/bag</text>
<rect x="275" y="360" width="230" height="50" rx="8" fill="#fff" stroke="#999"/>
<text x="390" y="379" text-anchor="middle" font-weight="bold">map_run/map/data.mdb</text>
<text x="390" y="396" text-anchor="middle" fill="#555">read by the node at each request</text>
<g stroke="#444" fill="none" marker-end="url(#a)">
<path d="M240,270 L273,270"/>
<path d="M505,262 L538,262"/>
<path d="M360,213 L360,162"/>
<path d="M420,162 L420,213"/>
<path d="M390,325 L390,358" stroke-dasharray="3 3"/>
</g>
<text x="352" y="196" fill="#2b6b2f" font-size="10" text-anchor="end">odometry, /tf, /rosout</text>
<text x="428" y="190" fill="#24538a" font-size="10">LocalizeInMap(map, pose_hint)</text>
<text x="428" y="203" fill="#24538a" font-size="10">/tf_static of the bag (latched)</text>
<text x="20" y="375" fill="#555" font-size="10">launch, play and record are started with</text><text x="20" y="388" fill="#555" font-size="10">start_new_session (own process group) and stopped</text>
<text x="20" y="401" fill="#555" font-size="10">with SIGINT -&gt; SIGTERM -&gt; SIGKILL (5 s each)</text>
</svg>
